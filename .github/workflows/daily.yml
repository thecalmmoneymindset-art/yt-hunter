name: daily-youtube-demand-scan
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python hunter.py
        env: {YOUTUBE_API_KEY: "${{ secrets.YOUTUBE_API_KEY }}"}
      - run: |
          git config user.name "hunter-bot"; git config user.email "bot@users.noreply.github.com"
          git add reports; git commit -m "daily report" || exit 0; git push
